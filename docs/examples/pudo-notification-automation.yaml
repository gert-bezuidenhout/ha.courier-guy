alias: Notification | PUDO Tracking
description: Notify only when a tracked parcel changes
triggers:
  - trigger: event
    event_type: pudo_tracking_updated
conditions: []
actions:
  - variables:
      notification_message: >-
        {%- set event = trigger.event.data -%}
        {%- set status = event.get('latest_event') or event.get('status') or 'unknown' -%}
        {%- set location = (event.get('location') or '') | trim -%}
        {%- set detail = (event.get('message') or '') | trim -%}
        {%- set timestamp = as_datetime(event.get('date'), none) -%}
        {%- set phrases = {
          'submitted': 'has been registered',
          'deposit-pending': 'is awaiting drop-off',
          'customer-deposited': 'has been dropped off',
          'collected': 'has been collected',
          'at-hub': 'has arrived at the hub',
          'at-destination-hub': 'has arrived at the destination hub',
          'in-transit': 'is in transit',
          'delivery-assigned': 'has been assigned to a delivery driver',
          'out-for-delivery': 'is out for delivery',
          'delivered': 'has been delivered',
          'cancelled': 'has been cancelled'
        } -%}
        {%- set plain_status = status | replace('-', ' ') | replace('_', ' ') | lower -%}
        {%- set phrase = phrases.get(status, 'has a tracking update: ' ~ plain_status) -%}
        {%- set hub_status = status in ['at-hub', 'at-destination-hub'] and location -%}
        {%- if hub_status -%}
          {%- set phrase = 'has arrived at the ' ~ location ~ (' destination hub' if status == 'at-destination-hub' else ' hub') -%}
        {%- endif -%}
        {%- set redundant = [
          plain_status,
          'at ' ~ location | lower ~ ' hub',
          'at ' ~ location | lower,
          'at hub',
          'at destination hub',
          'out for delivery',
          'delivered',
          'collected'
        ] -%}
        {%- set notification -%}
          Parcel {{ event.reference }} {{ phrase }}{% if location and not hub_status %} ({{ location }}){% endif %}.
          {% if detail and detail | lower | trim(' .!') not in redundant %}
            {{ detail.rstrip('.!') }}.
          {% endif %}
          {% if timestamp %}
            Last update: {{ as_local(timestamp).strftime('%d %b %Y at %H:%M') }}.
          {% endif %}
        {%- endset -%}
        {{ notification.split() | join(' ') }}
  - action: script.notification_all
    data:
      message: "{{ notification_message }}"
      tts_enabled: true
      tts_importance: low
      whatsapp_gert: false
      whatsapp_letitia: false
      tts_language: en-GB
      tts_voice: RyanNeural
      volume_level: 0.5
mode: queued
max: 20
